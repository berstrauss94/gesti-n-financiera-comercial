name: CI - Tests & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLASK_SECRET_KEY: ci-test-secret-key
  DATABASE_URL: sqlite:///test.db
  SESSION_TIMEOUT_MINUTES: 30
  MAX_LOGIN_ATTEMPTS: 5

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 hypothesis

      - name: Lint (optional - non-blocking)
        continue-on-error: true
        run: |
          flake8 app/ --max-line-length=120 --exclude=__pycache__,migrations

      - name: Run unit tests with coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml -v

      - name: Run property-based tests
        run: |
          pytest tests/property/ -x -v --timeout=120 || true

      - name: Verify migrations can be applied
        run: |
          flask db upgrade
        env:
          FLASK_APP: app:create_app()
