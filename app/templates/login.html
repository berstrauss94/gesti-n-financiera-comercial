{% extends "base.html" %}
{% block title %}Iniciar Sesión - Gestión Financiera{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <div class="auth-header">
        <h1>💰 FinanzApp</h1>
        <p>Gestión Financiera Comercial</p>
    </div>
    <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" placeholder="Tu nombre de usuario" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Tu contraseña" required autocomplete="current-password">
        </div>
        <div class="form-error" id="loginError" role="alert" aria-live="polite"></div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Iniciar Sesión</button>
    </form>
    <div class="auth-footer">
        <p>¿No tienes cuenta? <a href="{{ url_for('frontend.register') }}">Registrarse</a></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
